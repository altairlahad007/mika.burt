name: Build and deploy static site to Oracle Cloud - mikaburt

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  STAGING_DIR: ~/mikaburt-static # Staging dir in the SSH user's home
  WEB_DIR: /var/www/mikaburt.com # Served by nginx/apache

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'

      - name: npm install and build
        run: |
          npm install
          npm run build

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.OCI_SSH_KEY }}

      - name: Add instance to known_hosts
        run: ssh-keyscan -H ${{ secrets.OCI_HOST }} >> ~/.ssh/known_hosts

      - name: Upload build output to home staging dir
        run: rsync -avz --delete dist/ ${{ secrets.OCI_USER }}@${{ secrets.OCI_HOST }}:${{ env.STAGING_DIR }}/

      - name: Publish to web root
        run: |
          ssh ${{ secrets.OCI_USER }}@${{ secrets.OCI_HOST }} "
            sudo rsync -a --delete ${{ env.STAGING_DIR }}/ ${{ env.WEB_DIR }}/
          "
