<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120">
  <defs>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c084fc"/>
      <stop offset="25%" style="stop-color:#a855f7"/>
      <stop offset="50%" style="stop-color:#9333ea"/>
      <stop offset="75%" style="stop-color:#7e22ce"/>
      <stop offset="100%" style="stop-color:#6b21a8"/>
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c084fc"/>
      <stop offset="50%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#6b21a8"/>
    </linearGradient>
  </defs>

  <!-- Logo Icon -->
  <rect x="20" y="30" width="60" height="60" rx="12" fill="url(#iconGradient)"/>
  <text x="50" y="70" font-family="'Space Grotesk', system-ui, sans-serif" font-size="28" font-weight="800" fill="white" text-anchor="middle">M</text>

  <!-- Text -->
  <text x="100" y="72" font-family="'Space Grotesk', 'Inter', -apple-system, sans-serif" font-size="32" font-weight="800" fill="url(#textGradient)" letter-spacing="0.05em">MIKA.BURT</text>
</svg>